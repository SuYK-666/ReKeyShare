name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and quality gates
        run: mvn --batch-mode verify -Ddependency-check.skip=true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Frontend SBOM
        run: |
          npm ci
          npx --yes @cyclonedx/cyclonedx-npm --output-file target/bom-frontend.json
      - name: Security boundary guard
        run: sh scripts/check-security-boundary.sh
      - name: Generate reproducible experiment evidence
        run: sh scripts/run-all-experiments.sh
      - name: Documentation and performance evidence gates
        run: |
          sh scripts/check-docs-format.sh
          sh scripts/check-doc-links.sh
          sh scripts/check-performance-budget.sh
      - name: Release evidence checksums
        run: |
          sha256sum target/bom.json target/bom-frontend.json \
            docs/reports/attack-matrix/attack-results.json \
            docs/reports/attack-matrix/attack-results.md > target/evidence.sha256
      - name: Upload reports and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-evidence
          path: |
            docs/reports/raw
            docs/reports/summary
            target/site/jacoco
            target/bom.json
            target/bom-frontend.json
            target/evidence.sha256
            target/surefire-reports
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-checksums
          path: target/evidence.sha256

  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-
      - name: Check NVD API key presence
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is not configured or is unavailable to this workflow."
            exit 1
          fi
      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn --batch-mode org.owasp:dependency-check-maven:check
      - name: Upload dependency vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
